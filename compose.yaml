services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: takeaway
      POSTGRES_USER: takeaway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在.env配置POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U takeaway -d takeaway"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    env_file: .env
    command: [takeaway, db-upgrade]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:8765:8765"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: [takeaway, worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
