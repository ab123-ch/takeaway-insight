[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "takeaway-insight"
version = "0.1.0"
description = "餐账：外卖订单、商品销量与套餐拆分工作台"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20,<1",
  "itsdangerous>=2.2,<3",
  "httpx>=0.28,<1",
  "apscheduler>=3.11,<4",
  "mcp>=1.29,<2",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
takeaway = "takeaway_insight.cli:main"
takeaway-mcp = "takeaway_insight.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/takeaway_insight"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
